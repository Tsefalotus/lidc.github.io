<header>
  <a href="{{ site.github.url }}" class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="logo-icon">
      <circle cx="50" cy="50" r="40" fill="#fff" />
    </svg>
  </a>
  <nav>
    <ul>
      {% for item in site.data.settings.menu %}
        <li><a href="{{ site.github.url }}/{{ item.url }}">{{ item.name }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
