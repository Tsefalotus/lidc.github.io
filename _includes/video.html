<div class="video-container">
  {% if include.youtube %}
    <!-- Если есть ссылка на YouTube -->
    <a href="#" class="open-modal" data-video-id="{{ include.youtube }}">
      <video class="lazy-video" muted loop preload="none">
        <source src="{{ site.github.url }}/assets/videos/{{ include.video }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="overlay">
        <div class="text">
          {{ site.data.texts.project_texts[include.id] }}
        </div>
      </div>
    </a>
  {% else %}
    <!-- Если ссылки на YouTube нет -->
    <div class="video-preview">
      <video class="lazy-video" muted loop preload="none">
        <source src="{{ site.github.url }}/assets/videos/{{ include.video }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="overlay">
        <div class="text">
          {{ site.data.texts.project_texts[include.id] }}
        </div>
      </div>
    </div>
  {% endif %}
</div>
