<div class="video-container">
  {% if include.youtube %}
    <!-- Если есть ссылка на YouTube -->
    <div class="video-preview">
      <video class="lazy-video" muted loop preload="none" playsinline>
        <source src="{{ site.github.url }}/assets/videos/{{ include.video }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="overlay">
        <div class="text">
          <h2>{{ site.data.texts.project_texts[include.id].title }}</h2>
          <p>{{ site.data.texts.project_texts[include.id].description }}</p>
          <!-- Надпись "View full video" с обработчиком для открытия модального окна -->
          <span class="view-full-video" data-video-id="{{ include.youtube }}">VIEW FULL VIDEO</span>
        </div>
      </div>
    </div>
  {% else %}
    <!-- Если ссылки на YouTube нет -->
    <div class="video-preview">
      <video class="lazy-video" muted loop preload="none">
        <source src="{{ site.github.url }}/assets/videos/{{ include.video }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="overlay">
        <div class="text">
          <h2>{{ site.data.texts.project_texts[include.id].title }}</h2>
          <p>{{ site.data.texts.project_texts[include.id].description }}</p>
        </div>
      </div>
    </div>
  {% endif %}
</div>

<!-- Модальное окно -->
<div id="youtube-modal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <iframe id="youtube-iframe" frameborder="0" allowfullscreen></iframe>
  </div>
</div>
